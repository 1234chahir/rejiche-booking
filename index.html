.wa{background:#1faa59;border-color:#1faa59}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem}

.price{color:var(--sun);font-weight:700}
form,.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1rem;margin-bottom:.8rem}
label{display:block;margin:.5rem 0 .15rem;font-size:.9rem}
input,select,textarea{width:100%;padding:.55rem;font:inherit;border:1px solid #9bb;border-radius:4px;background:#fff}

input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

#un{font-size:.85rem;color:#a33}

footer{text-align:center;padding:1.5rem;color:#567}
@media(max-width:560px){.row{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.house{transition:transform .2s}.house:hover{transform:translateY(-3px)}}

 const fld=([k,l,ty],r={})=>{const v=r[k]??'';
  if(ty=='b')return`<label><input type="checkbox" name="${k}" ${(r[k]??true)?'checked':''}> ${l}</label>`;
  if(ty=='h')return`<label>${l}</label><select name="${k}"><option value="">كل المنازل</option>${HH.map(h=>`<option value="${h.id}" ${h.id==v?'selected':''}>${esc(h.name_ar)}</option>`).join('')}</select>`;
  if(ty=='t')return`<label>${l}</label><textarea name="${k}" rows="2">${esc(v)}</textarea>`;
  const val=ty=='p'?(v||[]).join(','):v;
  return`<label>${l}</label><input name="${k}" type="${ty=='n'?'number':ty=='d'?'date':'text'}" step="any" value="${esc(val)}">`+(ty=='p'?'<input type="file" accept="image/*" multiple data-up="1">':'')};
 const draw=r=>{
  $('#tb').innerHTML=`<form id="cf" class="card"><input type="hidden" name="id" value="${r?.id||''}">${F.map(f=>fld(f,r)).join('')}<p><button class="p">${r?'حفظ التعديل':'إضافة'}</button></p></form>`+
  (R||[]).map((x,n)=>`<div class="card">${esc(lab(x))}<br><button class="sm" data-e="${n}">تعديل</button><button class="sm" data-x="${x.id}">حذف</button></div>`).join('');
  const cf=$('#cf');
  cf.onchange=async e=>{if(!e.target.dataset.up)return;const p=cf.elements.photos,urls=p.value?p.value.split(','):[];
   for(const file of e.target.files){const path=Date.now()+'-'+file.name.replace(/[^\w.]/g,'_'),{error}=await sb.storage.from('house-photos').upload(path,file);
    if(error)return alert('فشل رفع الصورة');urls.push(sb.storage.from('house-photos').getPublicUrl(path).data.publicUrl)}
   p.value=urls.join(',')};
  cf.onsubmit=async e=>{e.preventDefault();const o={},el=cf.elements;
   F.forEach(([k,,ty])=>{const x=el[k];o[k]=ty=='b'?x.checked:ty=='n'?(x.value===''?null:+x.value):ty=='p'?x.value.split(',').map(s=>s.trim()).filter(Boolean):(x.value||null)});
   if(el.id.value)o.id=el.id.value;else if(table=='houses')o.slug='h'+Date.now();
   const{error}=await sb.from(table).upsert(o);if(error)return alert('تعذّر الحفظ: '+error.message);
   tbl()};
  $('#tb').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{draw(R[b.dataset.e]);scrollTo(0,0)});
  $('#tb').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('تأكيد الحذف؟')){const{error}=await sb.from(table).delete().eq('id',b.dataset.x);if(error)alert('لا يمكن حذف منزل له حجوزات. أخفِه بدلاً من ذلك.');tbl()}});
 };
 const tbl=()=>crud(table,F,ord,lab);draw();
}
function route(){const a=location.hash==='#admin';$('#pub').hidden=a;$('#adm').hidden=!a;if(a)adm()}
addEventListener('hashchange',route);load();route();
</script>
</body>
</html>
